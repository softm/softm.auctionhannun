name: Probe Onbid detail API

on:
  push:
    paths:
      - ".github/workflows/probe-onbid-detail.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
      ONBID_DETAIL_SERVICE_KEY: ${{ secrets.ONBID_DETAIL_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe one detail record
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { onbidListUrl } from "./scripts/probe-onbid.mjs";
          import { onbidDetailUrl, onbidDetailItems, onbidPhotoUrls } from "./scripts/collect-onbid.mjs";
          const listKey = process.env.ONBID_SERVICE_KEY;
          const detailKey = process.env.ONBID_DETAIL_SERVICE_KEY || listKey;
          if (!listKey || !detailKey) throw new Error("ONBID key missing");
          const listResponse = await fetch(onbidListUrl(listKey, { pageNo: 1, numOfRows: 1 }), { headers: { accept: "application/json" } });
          const listPayload = await listResponse.json();
          const listData = listPayload.response || listPayload;
          const row = Array.isArray(listData.body?.items?.item) ? listData.body.items.item[0] : listData.body?.items?.item;
          if (!listResponse.ok || String(listData.header?.resultCode) !== "00" || !row?.cltrMngNo) {
            console.log(JSON.stringify({ listHttpStatus: listResponse.status, listResultCode: String(listData.header?.resultCode || "UNKNOWN"), detailState: "not-tested" }));
            process.exit(2);
          }
          const detailResponse = await fetch(onbidDetailUrl(detailKey, row.cltrMngNo), { headers: { accept: "application/json" } });
          let detailResultCode = "HTTP_ONLY";
          let detailItemCount = 0;
          let photoCount = 0;
          if (detailResponse.ok) {
            const payload = await detailResponse.json();
            const data = payload.response || payload;
            detailResultCode = String(data.header?.resultCode || "UNKNOWN");
            if (detailResultCode === "00") {
              const items = onbidDetailItems(payload);
              detailItemCount = items.length;
              photoCount = [...new Set(items.flatMap(onbidPhotoUrls))].length;
            }
          }
          console.log(JSON.stringify({ listHttpStatus: listResponse.status, detailHttpStatus: detailResponse.status, detailResultCode, detailItemCount, photoCount, detailState: detailResponse.ok && detailResultCode === "00" ? "accessible" : "denied-or-provider-error" }));
          if (!(detailResponse.ok && detailResultCode === "00")) process.exit(3);
          NODE
