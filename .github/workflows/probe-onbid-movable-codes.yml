name: Probe Onbid movable property codes

on:
  push:
    paths:
      - ".github/workflows/probe-onbid-movable-codes.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe property codes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          let key=process.env.ONBID_SERVICE_KEY||"";
          if (/%[0-9a-f]{2}/i.test(key)) key=decodeURIComponent(key);
          for (let n=1;n<=10;n++){
            const code=String(n).padStart(4,"0");
            const url=new URL("https://apis.data.go.kr/B010003/OnbidMvastListSrvc2/getMvastCltrList2");
            url.search=new URLSearchParams({serviceKey:key,pageNo:"1",numOfRows:"1",resultType:"json",prptDivCd:code,pvctTrgtYn:"N"});
            const r=await fetch(url,{headers:{accept:"application/json"}});
            const body=await r.text(); let json=null; try{json=JSON.parse(body)}catch{}
            const env=json?.response||json||{};
            console.log(JSON.stringify({code,http:r.status,resultCode:String(env.header?.resultCode||"UNKNOWN"),resultMsg:String(env.header?.resultMsg||env.header?.resultMessage||"").slice(0,120),total:Number(env.body?.totalCount||0)}));
            await new Promise(res=>setTimeout(res,250));
          }
          NODE
