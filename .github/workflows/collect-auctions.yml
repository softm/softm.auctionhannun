name: Collect approved court and official Onbid data

on:
  push:
    paths:
      - ".github/collect-now"
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auction-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      AUCTION_FEED_URL: ${{ secrets.AUCTION_FEED_URL || vars.AUCTION_FEED_URL }}
      AUCTION_FEED_TOKEN: ${{ secrets.AUCTION_FEED_TOKEN }}
      ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
      ONBID_IMAGE_ENRICH_LIMIT: ${{ vars.ONBID_IMAGE_ENRICH_LIMIT || 80 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect approved feed (never substitute fixtures)
        if: env.AUCTION_FEED_URL != ''
        id: collect
        continue-on-error: true
        run: npm run collect
      - name: Collect Onbid separately
        id: onbid
        continue-on-error: true
        run: npm run collect:onbid
      - run: npm run check
      - name: Propose verified catalog or failure status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="feature/data-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          node scripts/commit-data.mjs
          if git diff --quiet origin/main HEAD; then
            exit 0
          fi
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$(date +%Y%m%d)_data_경매수집결과" --body "검증된 목록·상세·수집 상태입니다. 실패 시 마지막 정상 자료를 유지합니다. 공급 범위와 원본 이용 권한을 확인한 후 병합해 주세요. 병합 후 Pages가 배포됩니다."
      - name: Report collection failure
        if: steps.collect.outcome == 'failure' || steps.onbid.outcome == 'failure'
        run: exit 1
