name: Verify common vault integration
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'account.js'
      - 'account.css'
      - 'cloud-workspace.js'
      - 'firebase-config.js'
      - 'index.html'
      - 'workspace-store.js'
      - 'tests/workspace-store.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/COMMON-VAULT.md'
      - '.github/workflows/common-vault-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing application regression checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
