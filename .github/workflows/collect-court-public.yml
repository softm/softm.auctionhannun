name: Collect nationwide court auction list

on:
  push:
    paths:
      - ".github/court-collect-now"
  schedule:
    - cron: "10 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: court-nationwide-list
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      COURT_LIST_MIN_INTERVAL_MS: 1600
      COURT_LIST_JITTER_MS: 900
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect complete nationwide court list
        run: npm run collect:court-list
      - name: Validate complete snapshot
        run: npm run check
      - name: Publish verified nationwide snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="feature/court-list-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          node scripts/commit-data.mjs
          if git diff --quiet origin/main HEAD; then
            exit 0
          fi
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$(date +%Y%m%d)_data_법원경매전국목록" --body "법원경매정보 전국 17개 시·도 기본목록 전수수집 결과입니다. 각 시·도 totalCnt와 실제 페이지 행수가 모두 일치한 경우에만 생성됩니다. 상세는 물건 클릭 시 별도 API에서 조회합니다.")"
          gh pr merge "$PR_URL" --squash --delete-branch
